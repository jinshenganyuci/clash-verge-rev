name: IKUN Windows x64

on:
  push:
    branches: [feat/xboard-windows-preview]
  workflow_dispatch:
    inputs:
      installer_run:
        description: Existing workflow run ID to smoke test its installer without rebuilding
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: xboard-windows-${{ github.ref }}-${{ inputs.installer_run || 'build' }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ !inputs.installer_run }}
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: app
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: short
      NODE_OPTIONS: --max-old-space-size=4096
      XBOARD_SERVICE_SOURCE: ${{ github.workspace }}/service
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
          fetch-depth: 0

      - name: Checkout matching Xboard service
        uses: actions/checkout@v7
        with:
          repository: jinshenganyuci/clash-verge-service-ipc
          ref: f1eec0aa31f3ba2ae1115b3febc2402034f08acd
          path: service

      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
          run_install: false

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate translations and format changed frontend sources
        run: |
          pnpm i18n:types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(git diff --name-only --diff-filter=ACMR c83f7ad529c7c9cb3d2d54a0955ef8c1b22a411b -- src scripts src-tauri/tauri.conf.json src-tauri/tauri.windows.conf.json src-tauri/capabilities/desktop.json | Where-Object { $_ -match '\.(ts|tsx|mjs|json|css)$' })
          if ($files.Count -gt 0) {
            pnpm exec biome format --write @files
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $scripts = @($files | Where-Object { $_ -match '\.(ts|tsx)$' -and $_ -notmatch '/generated/|/bindings\.ts$' })
            if ($scripts.Count -gt 0) { pnpm exec eslint --fix @scripts }
          }

      - name: Verify frontend formatting is committed
        run: git diff --exit-code -- src scripts src-tauri/tauri.conf.json src-tauri/tauri.windows.conf.json src-tauri/capabilities/desktop.json

      - name: Frontend lint and tests
        run: |
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm arch:check

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ikun-check-v1
          workspaces: |
            app -> target
            service -> target
          cache-on-failure: true

      - name: Prepare Windows x64 cores and isolated service
        run: pnpm prebuild x86_64-pc-windows-msvc

      - name: Verify isolated service channel
        run: cargo test --manifest-path ../service/Cargo.toml --locked --release --target x86_64-pc-windows-msvc --features standalone,client,xboard-channel --lib channel::tests

      - name: Check the pinned dependency lock
        run: cargo metadata --locked --format-version 1 --no-deps | Out-Null

      - name: Format Rust and generate IPC bindings
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content dist/index.html '<!doctype html><title>IPC contract generation</title>'
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm gen:contract

      - name: Verify generated sources match the commit
        run: git diff --exit-code

      - name: Typecheck generated frontend contracts
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Rust code quality
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check the first-connection dialog in Edge
        id: guide_ui
        continue-on-error: true
        run: node scripts/guide-smoke.mjs artifacts/guide-ui

      - name: Upload connection guide UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ikun-guide-ui
          path: app/artifacts/guide-ui
          if-no-files-found: ignore

      - name: Xboard backend tests
        id: backend_tests
        continue-on-error: true
        run: cargo test -p clash-verge --lib xboard --locked --features clippy

      - name: Require all validation checks before packaging
        if: steps.typecheck.outcome != 'success' || steps.clippy.outcome != 'success' || steps.backend_tests.outcome != 'success' || steps.guide_ui.outcome != 'success'
        run: throw 'TypeScript, Clippy, backend tests and connection guide UI checks must all pass before building an installer.'

      - name: Restore release build cache after validation
        uses: Swatinem/rust-cache@v2
        with:
          key: ikun-release-v1
          workspaces: |
            app -> target
            service -> target
          cache-on-failure: true

      - name: Build the Windows x64 installer
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Verify payload architecture and calculate checksum
        run: |
          $payloads = @('target/x86_64-pc-windows-msvc/release/IKUN.exe')
          $payloads += @(Get-ChildItem src-tauri/resources/*service*.exe | ForEach-Object { $_.FullName })
          $payloads += @(Get-ChildItem src-tauri/sidecar/*x86_64-pc-windows-msvc.exe | ForEach-Object { $_.FullName })
          foreach ($path in $payloads) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
            if ($machine -ne 0x8664) { throw "Non-x64 payload: $path" }
          }
          $installers = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          "Commit: ${{ github.sha }}" | Set-Content "$($installer.DirectoryName)/build-info.txt"
          "SHA256: $hash" | Add-Content "$($installer.DirectoryName)/build-info.txt"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: IKUN-windows-x64
          path: |
            app/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            app/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
            app/target/x86_64-pc-windows-msvc/release/bundle/nsis/build-info.txt
          if-no-files-found: error

      - name: Smoke test isolated Windows installation
        timeout-minutes: 20
        run: |
          $installer = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one x64 installer' }
          ./scripts/xboard-install-smoke.ps1 -InstallerPath $installer[0].FullName -ExerciseMissingWebView2

      - name: Upload installation smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ikun-install-smoke
          path: ${{ runner.temp }}/ikun-smoke-artifacts
          if-no-files-found: ignore

      - name: Download the released first preview for migration coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download xboard-preview-2.5.10.1 --repo ${{ github.repository }} --pattern '*_x64-setup.exe' --dir previous-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previous = @(Get-ChildItem previous-installer/*_x64-setup.exe)
          if ($previous.Count -ne 1) { throw 'Expected the first preview installer' }
          $hash = (Get-FileHash -LiteralPath $previous[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f5969790031dfc25336fdbf7972cb2003cb309fdb603b56a1ebe999270e83eb5') { throw 'The first preview installer checksum changed' }

      - name: Upgrade the first preview into the IKUN installation directory
        timeout-minutes: 20
        run: |
          $installer = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          $previous = @(Get-ChildItem previous-installer/*_x64-setup.exe)
          if ($installer.Count -ne 1 -or $previous.Count -ne 1) { throw 'Expected one current and one previous installer' }
          ./scripts/xboard-install-smoke.ps1 -InstallerPath $installer[0].FullName -PreviousInstallerPath $previous[0].FullName

      - name: Upload first-preview upgrade smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ikun-upgrade-smoke
          path: ${{ runner.temp }}/ikun-upgrade-smoke-artifacts
          if-no-files-found: ignore

      - name: Save generated source changes
        if: always()
        run: |
          git diff --binary HEAD --output=ci-generated.patch

      - name: Upload generated source changes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ikun-generated-sources
          path: app/ci-generated.patch
          if-no-files-found: ignore

  installed-ui:
    if: ${{ inputs.installer_run }}
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          path: app

      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - name: Download the existing Windows x64 installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: IKUN-windows-x64
          run-id: ${{ inputs.installer_run }}
          github-token: ${{ github.token }}
          path: downloaded-installer

      - name: Smoke test the existing installer with current UI checks
        timeout-minutes: 20
        run: |
          $installer = @(Get-ChildItem ../downloaded-installer/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one x64 installer' }
          ./scripts/xboard-install-smoke.ps1 -InstallerPath $installer[0].FullName

      - name: Upload installation UI smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ikun-installed-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ikun-smoke-artifacts
          if-no-files-found: ignore

      - name: Download the released first preview for migration coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download xboard-preview-2.5.10.1 --repo ${{ github.repository }} --pattern '*_x64-setup.exe' --dir previous-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previous = @(Get-ChildItem previous-installer/*_x64-setup.exe)
          if ($previous.Count -ne 1) { throw 'Expected the first preview installer' }
          $hash = (Get-FileHash -LiteralPath $previous[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f5969790031dfc25336fdbf7972cb2003cb309fdb603b56a1ebe999270e83eb5') { throw 'The first preview installer checksum changed' }

      - name: Upgrade the first preview into the IKUN installation directory
        timeout-minutes: 20
        run: |
          $installer = @(Get-ChildItem ../downloaded-installer/*-setup.exe)
          $previous = @(Get-ChildItem previous-installer/*_x64-setup.exe)
          if ($installer.Count -ne 1 -or $previous.Count -ne 1) { throw 'Expected one current and one previous installer' }
          ./scripts/xboard-install-smoke.ps1 -InstallerPath $installer[0].FullName -PreviousInstallerPath $previous[0].FullName

      - name: Upload first-preview upgrade smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ikun-upgrade-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ikun-upgrade-smoke-artifacts
          if-no-files-found: ignore

